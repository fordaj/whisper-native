name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  build-cross:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64 }
          - { target: linux-arm64 }
          - { target: windows-x86_64 }
          - { target: windows-arm64 }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  platform=x86_64-linux ;;
            Linux-aarch64|Linux-arm64) platform=aarch64-linux ;;
            *) echo "unsupported CI platform: $(uname -s)-$(uname -m)" >&2; exit 2 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${platform}-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o zig.tar.xz "$url"
          tar -xJf zig.tar.xz
          echo "$PWD/zig-${platform}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          if [[ "$(uname -s)" != "Darwin" ]]; then zig version; else clang++ --version; fi

      - name: Build ${{ matrix.target }}
        shell: bash
        run: BUILD_MODE=release TARGETS="${{ matrix.target }}" ./scripts/build.sh

      - name: Smoke test (Linux x86_64)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          file build/release/linux-x86_64/whisper-cli
          build/release/linux-x86_64/whisper-cli --help >/dev/null
          build/release/linux-x86_64/whisper-cli --version

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: whisper-native-${{ matrix.target }}
          path: |
            build/release/${{ matrix.target }}/whisper-cli*
            build/release/${{ matrix.target }}/whisper-server*
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted macOS runners are not available for this
          # repository (macos-14 jobs are cancelled immediately with no
          # runner assigned; macos-13 queues forever), so macOS targets
          # build on the org's self-hosted macOS pool — the same setup
          # the logamuffin starting CI used. These jobs stay queued
          # until the runner group is granted access to this repo.
          - { target: macos-x86_64, runner: [self-hosted, macOS] }
          - { target: macos-arm64, runner: [self-hosted, macOS] }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tool versions
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          clang++ --version

      - name: Build ${{ matrix.target }}
        shell: bash
        run: BUILD_MODE=release TARGETS="${{ matrix.target }}" ./scripts/build.sh

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: whisper-native-${{ matrix.target }}
          path: |
            build/release/${{ matrix.target }}/whisper-cli*
            build/release/${{ matrix.target }}/whisper-server*
          if-no-files-found: error
          compression-level: 0

  test-models:
    name: Model smoke test (Linux x86_64)
    needs: build-cross
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download linux-x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: whisper-native-linux-x86_64
          path: build/release/linux-x86_64

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-models-tiny-tiny.en-v1

      - name: Run model smoke tests (English + multilingual)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/release/linux-x86_64/whisper-cli
          WHISPER_CLI="$PWD/build/release/linux-x86_64/whisper-cli" ./scripts/test_models.sh

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cross, build-macos, test-models]
    # The release job rebuilds all six targets (scripts/release.sh runs
    # scripts/build.sh), so it needs the Apple toolchain for the macOS
    # targets and Zig for the other four. GitHub-hosted macOS runners
    # are unavailable here (see build matrix above), hence the
    # self-hosted pool.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          if command -v zig >/dev/null 2>&1; then
            echo "zig already present: $(zig version)"
            exit 0
          fi
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)     platform=x86_64-macos ;;
            Darwin-arm64)      platform=aarch64-macos ;;
            Linux-x86_64)      platform=x86_64-linux ;;
            Linux-aarch64|Linux-arm64) platform=aarch64-linux ;;
            *) echo "unsupported CI platform: $(uname -s)-$(uname -m)" >&2; exit 2 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${platform}-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o zig.tar.xz "$url"
          tar -xJf zig.tar.xz
          echo "$PWD/zig-${platform}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Ensure CMake
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null 2>&1; then
            cmake --version
            exit 0
          fi
          brew install cmake

      - name: Build, package and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --from-tag
